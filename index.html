<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#1F3A3F">
        <title>Paycheck Distribution</title>
        <link rel="stylesheet" href="style.css">
        <link rel="manifest" href="./manifest.json">
    </head>

    <body>
        <main class="app">
            <header>
                <h1>Paycheck Allocation Tool </h1>
            </header>

            <section class="paycheck-card">
                <div class="money-input">
                    <label for="paycheck">Paycheck Amount</label>
                    <span>$</span>
                    <input type="text" id="paycheck" placeholder="0.00" inputmode="decimal">
                </div>
            </section>

            <section class="distribution">

            <h2> Funds Allocated</h2>

                <div class="distribution-row">
                    <div>
                        <h3>Remittance</h3>
                        <p>40% of paycheck</p>
                    </div>
                    <span id="remittance">$0.00</span>
                </div>

                <div class="distribution-row">
                    <div>
                        <h3>Tithe</h3>
                        <p>10% of paycheck</p>
                    </div>
                    <span id="tithe">$0.00</span>
                </div>

                <div class="distribution-row">
                    <div>
                        <h3>Savings</h3>
                        <p>25% of paycheck</p>
                    </div>
                    <span id="savings">$0.00</span>
                </div>

                <div class="distribution-row">
                    <div>
                        <h3>Funds Remaining</h3>
                        <p>After all deductions</p>
                    </div>
                    <span id="remaining">$0.00</span>
                </div>

            </section>
        </main>
        <script src="script.js"></script>
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("./service-worker.js");
            }
        </script>
    </body>
</html>
